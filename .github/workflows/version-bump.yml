name: Version Bump

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read_version
        run: |
          VERSION=$(grep '^version:' plugin.yaml | sed 's/version: *//')
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Compute new version
        id: new_version
        run: |
          VERSION="${{ steps.read_version.outputs.current }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          BUMP="${{ github.event.inputs.bump_type }}"
          # Default to patch on push events
          if [ -z "$BUMP" ]; then
            BUMP="patch"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update plugin.yaml
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new }}"
          sed -i "s/^version:.*/version: $NEW_VERSION/" plugin.yaml
          echo "Updated plugin.yaml to version $NEW_VERSION"

      - name: Update package metadata
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "Updated pyproject.toml to version $NEW_VERSION"

      - name: Update README.md version badge
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new }}"
          sed -i "s|!\[Version\](https://img\.shields\.io/badge/version-[^-]*-blue)|![Version](https://img.shields.io/badge/version-$NEW_VERSION-blue)|" README.md
          echo "Updated README.md badge to version $NEW_VERSION"

      - name: Commit new version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.yaml README.md
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:main
